# =========================
# Split
# =========================
CONFIG_ZMK_SPLIT=y


# =========================
# Bluetooth
# =========================
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y
# Nombre del dispositivo
CONFIG_BT_DEVICE_NAME="zmk100"

# =========================
# Power Saving
# =========================
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000